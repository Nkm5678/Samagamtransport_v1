name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scaffold Capacitor Android Wrapper
        run: |
          mkdir -p www
          cp *.html www/ 2>/dev/null || true
          cp -r static www/static 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          if [ ! -f www/index.html ]; then
            cp driver_rider_companion.html www/index.html 2>/dev/null || echo "<h1>Samagam Transport</h1>" > www/index.html
          fi
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Samagam Transport" "org.samagam.transport" --web-dir=www
          npx cap add android

      - name: Inject Geolocation & Internet Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application android:usesCleartextTraffic="true"|g' $MANIFEST

      - name: Compile Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Samagam-Transport-Driver-Sevadar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk