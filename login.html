<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff & Sevadar Gate Sign-In | Samagam Transport</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl space-y-5">
        <div class="text-center">
            <span class="text-3xl">🚌</span>
            <h1 class="font-bold text-xl text-white mt-1">Samagam Command Sign-In</h1>
            <p class="text-xs text-slate-400">Authenticate with your registered mobile & live location</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4 text-sm">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">Registered Mobile Number</label>
                <input type="text" id="login-mobile" required placeholder="e.g. 9820110001" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3.5 py-3 text-white text-base">
            </div>

            <div id="login-status" class="text-xs text-amber-400 min-h-[18px]"></div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg">
                Verify Location & Sign In
            </button>
        </form>

        <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-700 text-center text-xs">
            <a href="/volunteer_register.html" class="bg-slate-700 hover:bg-slate-600 py-2.5 rounded-lg font-semibold">New Volunteer Reg</a>
            <a href="/driver_rider_companion.html" class="bg-indigo-700 hover:bg-indigo-600 py-2.5 rounded-lg font-semibold">Driver Mobile App</a>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const statusEl = document.getElementById('login-status');
            statusEl.textContent = '📡 Verifying 2.0km duty geofence...';
            const mobile = document.getElementById('login-mobile').value.trim();

            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            mobile_number: mobile,
                            latitude: pos.coords.latitude,
                            longitude: pos.coords.longitude
                        })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        localStorage.setItem('samagam_session', JSON.stringify(data));
                        window.location.href = data.volunteer.can_view_all_territories ? '/admin_dashboard.html' : '/territory_dashboard.html';
                    } else {
                        statusEl.textContent = '❌ ' + (data.detail || 'Authentication failed.');
                    }
                },
                (err) => { statusEl.textContent = '❌ Please enable GPS location to verify duty hub.'; },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
    </script>
</body>
</html>
